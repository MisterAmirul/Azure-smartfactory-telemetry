apiVersion: apps/v1
kind: Deployment
metadata:
  name: factory-simulator-deployment
  namespace: default
  labels:
    app: factory-sim
spec:
  replicas: 2
  selector:
    matchLabels:
      app: factory-sim
  template:
    metadata:
      labels:
        app: factory-sim
    spec:
      containers:
      - name: factory-sim-container
        image: detroitfactoryacr.azurecr.io/factory-sim:v2
        imagePullPolicy: Always
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAME
          valueFrom:
            fieldRef:
               fieldPath: metadata.name
            